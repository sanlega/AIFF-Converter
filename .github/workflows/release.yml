name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: dist/AIFF_Converter.exe
          - os: ubuntu-latest
            artifact: dist/AIFF_Converter

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y python3-tk

      - name: Install deps
        # tkinterdnd2 excluded from CI builds — exe uses file picker + drag-onto-exe
        run: pip install imageio-ffmpeg pyinstaller

      - name: Build executable
        run: python build.py

      - name: Mark executable (Linux)
        if: runner.os == 'Linux'
        run: chmod +x dist/AIFF_Converter

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          generate_release_notes: true
