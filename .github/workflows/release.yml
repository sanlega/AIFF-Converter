name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: AIFF_Converter_Windows.zip
          - os: ubuntu-latest
            artifact: AIFF_Converter_Linux.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y python3-tk

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        run: pip install -r requirements.txt

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        # tkinterdnd2 is skipped on Linux CI — app uses file picker instead
        run: pip install imageio-ffmpeg pyinstaller

      - name: Build executable
        run: python build.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\AIFF_Converter -DestinationPath AIFF_Converter_Windows.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/AIFF_Converter/AIFF_Converter
          tar -czf AIFF_Converter_Linux.tar.gz -C dist AIFF_Converter

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          generate_release_notes: true
